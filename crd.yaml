apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: drpolicies.resilience.io
spec:
  group: resilience.io
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                targetNamespace:
                  type: string
                healthCheckEndpoint:
                  type: string
                failureThresholdSeconds:
                  type: integer
                veleroBackupName:
                  type: string
                chaosEnabled:
                  type: boolean
            status:
              type: object
              properties:
                phase:
                  type: string
                lastFailoverTime:
                  type: string
                lastRtoSeconds:
                  type: number
      subresources:
        status: {}
  scope: Namespaced
  names:
    plural: drpolicies
    singular: drpolicy
    kind: DRPolicy
    shortNames:
      - drp
